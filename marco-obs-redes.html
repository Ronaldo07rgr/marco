<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marco para OBS</title>
<style>
@property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@property --c1 { syntax: '<color>'; initial-value: #53FC18; inherits: true; }
@property --c2 { syntax: '<color>'; initial-value: #00D4FF; inherits: true; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: transparent; overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }

.stage {
  --c1: #53FC18; --c2: #00D4FF;
  position: fixed; inset: 0;
  container-type: size;
  overflow: hidden;
  background: transparent;
  transition: --c1 1s ease-in-out, --c2 1s ease-in-out;
}

/* ---------- Borde animado: la misma luz de antes, pero con forma que rodea el cubo ---------- */
.frame { position: absolute; inset: 0; pointer-events: none; }
.ring {
  position: absolute; inset: 0;
  -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat;
  mask: var(--m) 0 0 / 100% 100% no-repeat;
}
.r3 {
  background: rgba(255,255,255,.18);
  -webkit-mask: var(--mh) 0 0 / 100% 100% no-repeat;
  mask: var(--mh) 0 0 / 100% 100% no-repeat;
}

/* Cromático: dos cometas de colores que dan vueltas */
.frame[data-style="chroma"] .r1 {
  background: conic-gradient(from var(--a), transparent 0 52%, var(--c1) 88%, transparent 100%);
  animation: spin 4.6s linear infinite;
  mix-blend-mode: screen;
}
.frame[data-style="chroma"] .r2 {
  background: conic-gradient(from var(--a), transparent 0 52%, var(--c2) 88%, transparent 100%);
  animation: spin 4.6s linear infinite;
  animation-delay: -.3s;
  mix-blend-mode: screen;
}

/* Neón */
.frame[data-style="neon"] { filter: drop-shadow(0 0 .8cqh var(--c1)) drop-shadow(0 0 2.2cqh var(--c2)); }
.frame[data-style="neon"] .r1 {
  background: linear-gradient(135deg, var(--c1), var(--c2));
  animation: breathe 2.6s ease-in-out infinite;
}
.frame[data-style="neon"] .r2,
.frame[data-style="neon"] .r3,
.frame[data-style="rainbow"] .r2,
.frame[data-style="rainbow"] .r3 { display: none; }

/* Arcoíris */
.frame[data-style="rainbow"] { filter: drop-shadow(0 0 1.4cqh rgba(255,255,255,.35)); }
.frame[data-style="rainbow"] .r1 {
  background: conic-gradient(from var(--a), #ff3d81, #ffb347, #c6ff3d, #2ee6a6, #25f4ee, #7b6cff, #ff3d81);
  animation: spin 6s linear infinite;
}

@keyframes spin { to { --a: 360deg; } }
@keyframes breathe { 0%,100% { opacity: .78; } 50% { opacity: 1; } }

/* ---------- Cubo de Kick, abajo al centro ---------- */
.kick {
  --fh: 7.2cqh;
  position: absolute; left: 50%;
  bottom: 0;
  width: 0; height: var(--fh);
  perspective: 120cqh;
  transform-style: preserve-3d;
  z-index: 2;
}
.face {
  position: absolute; left: 0; top: 0;
  translate: -50% 0;
  width: var(--fw, auto);
  height: var(--fh);
  display: flex; align-items: center; justify-content: center;
  padding: 0 calc(var(--fh) * .55);
  border-radius: 0;
  background: #0a0d09;
  border: max(1px, .3cqh) solid rgba(255,255,255,.16);
  box-shadow: 0 0 1.8cqh rgba(0,0,0,.45);
  white-space: nowrap;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform-origin: 50% 50% calc(var(--fh) * -.5);
  will-change: transform;
}
.face svg { display: block; height: calc(var(--fh) * .52); width: auto; flex: none; }
.face { gap: calc(var(--fh) * .22); }
.face--hidden { visibility: hidden; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="ring r3"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
  </div>

  <div class="kick" id="kick">
  </div>
</div>

<script>
/* ============ AJUSTES: cambia lo que quieras aquí ============ */
var CONFIG = {
  segundosRed: 6,             // cuánto se ve cada red antes de girar a la siguiente (puedes poner 'segundos' en una red para cambiarle el tiempo)
  estilo: 'chroma',           // 'chroma' | 'neon' | 'rainbow'
  colorPorRed: true,          // el borde cambia al color de la red que se muestra (false = colores fijos de abajo)
  color1: '#53FC18',          // colores fijos del borde (solo si colorPorRed es false)
  color2: '#00D4FF',
  sincronizar: true,          // el giro espera a que la luz del borde no pase por abajo (solo 'chroma')
  /* Orden en que van saliendo. Quita o cambia de orden las líneas que quieras.
     red: 'kick' | 'instagram' | 'tiktok' | 'youtube'   ·   segundos: opcional, tiempo propio de esa red
     color1 / color2: opcionales, para cambiar los colores del borde de esa red */
  redes: [
    { red: 'kick',      usuario: 'TheBicho07', segundos: 10 },
    { red: 'instagram', usuario: '_thebicho_' },
    { red: 'tiktok',    usuario: '_thebicho'  },
    { red: 'youtube',   usuario: '@TheBicho07' }
  ]
};
/* ============================================================= */

(function () {
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');
  var kick = document.getElementById('kick');

  frame.setAttribute('data-style', CONFIG.estilo);
  stage.style.setProperty('--c1', CONFIG.color1);
  stage.style.setProperty('--c2', CONFIG.color2);

  /* Usuario con letras cuadradas (mayúsculas, números, _ - .) */
  var RAW = {
    A:'01110 10001 10001 11111 10001 10001 10001', B:'11110 10001 10001 11110 10001 10001 11110',
    C:'01110 10001 10000 10000 10000 10001 01110', D:'11110 10001 10001 10001 10001 10001 11110',
    E:'11111 10000 10000 11110 10000 10000 11111', F:'11111 10000 10000 11110 10000 10000 10000',
    G:'01110 10001 10000 10111 10001 10001 01111', H:'10001 10001 10001 11111 10001 10001 10001',
    I:'01110 00100 00100 00100 00100 00100 01110', J:'00111 00010 00010 00010 00010 10010 01100',
    K:'10001 10010 10100 11000 10100 10010 10001', L:'10000 10000 10000 10000 10000 10000 11111',
    M:'10001 11011 10101 10101 10001 10001 10001', N:'10001 11001 10101 10011 10001 10001 10001',
    O:'01110 10001 10001 10001 10001 10001 01110', P:'11110 10001 10001 11110 10000 10000 10000',
    Q:'01110 10001 10001 10001 10101 10010 01101', R:'11110 10001 10001 11110 10100 10010 10001',
    S:'01111 10000 10000 01110 00001 00001 11110', T:'11111 00100 00100 00100 00100 00100 00100',
    U:'10001 10001 10001 10001 10001 10001 01110', V:'10001 10001 10001 10001 10001 01010 00100',
    W:'10001 10001 10001 10101 10101 11011 10001', X:'10001 10001 01010 00100 01010 10001 10001',
    Y:'10001 10001 01010 00100 00100 00100 00100', Z:'11111 00001 00010 00100 01000 10000 11111',
    '0':'01110 10001 10011 10101 11001 10001 01110', '1':'00100 01100 00100 00100 00100 00100 01110',
    '2':'01110 10001 00001 00010 00100 01000 11111', '3':'11110 00001 00001 01110 00001 00001 11110',
    '4':'00010 00110 01010 10010 11111 00010 00010', '5':'11111 10000 11110 00001 00001 10001 01110',
    '6':'00110 01000 10000 11110 10001 10001 01110', '7':'11111 00001 00010 00100 01000 01000 01000',
    '8':'01110 10001 10001 01110 10001 10001 01110', '9':'01110 10001 10001 01111 00001 00010 01100',
    '_':'00000 00000 00000 00000 00000 00000 11111', '-':'00000 00000 00000 11111 00000 00000 00000',
    '.':'00000 00000 00000 00000 00000 01100 01100',
    '@':'01110 10001 10111 10101 10110 10000 01111'
  };
  var FONT = {};
  Object.keys(RAW).forEach(function (k) { FONT[k] = RAW[k].split(' '); });

  function userSvg(text, color) {
    var t = text.toUpperCase(), x = 0, d = '', adv = 6.5, i, r, c, g;
    for (i = 0; i < t.length; i++) {
      g = FONT[t.charAt(i)];
      if (g) {
        for (r = 0; r < 7; r++) for (c = 0; c < 5; c++) {
          if (g[r].charAt(c) === '1') d += 'M' + (x + c) + ' ' + r + 'h1v1h-1z';
        }
      }
      x += adv;
    }
    var w = Math.max(x - 1.5 + .5, 5.5);
    return '<svg viewBox="-.25 -.25 ' + w + ' 7.5" style="aspect-ratio:' + w + ' / 7.5" shape-rendering="crispEdges">' +
      '<path d="' + d + '" fill="' + color + '" stroke="' + color + '" stroke-width=".5" stroke-linejoin="miter"/></svg>';
  }

  /* Iconos y color de cada red */
  var SQ = 'style="aspect-ratio:1 / 1" viewBox="0 0 24 24"';
  var REDES = {
    kick: { color: '#53FC18', c1: '#53FC18', c2: '#00D4FF', icon: '<svg style="aspect-ratio:21 / 24" viewBox="0 0 21 24"><path fill="#53FC18" fill-rule="evenodd" d="M0 .028h7.7v5.32h2.561v-2.66h2.562V.028h7.7v7.996H17.96v2.66h-2.562v2.66h2.562v2.66h2.562V24h-7.699v-2.66h-2.562v-2.66H7.7V24H0V.028Z"/></svg>' },
    instagram: {
      color: '#FF4D8D', c1: '#FF3D81', c2: '#FEDA75',
      icon: '<svg ' + SQ + '><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".35" stop-color="#FA7E1E"/><stop offset=".65" stop-color="#D62976"/><stop offset="1" stop-color="#962FBF"/></linearGradient></defs>' +
        '<rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#ig)" stroke-width="2.4"/>' +
        '<circle cx="12" cy="12" r="4.6" fill="none" stroke="url(#ig)" stroke-width="2.4"/><circle cx="17.6" cy="6.4" r="1.5" fill="#D62976"/></svg>'
    },
    tiktok: {
      color: '#25F4EE', c1: '#25F4EE', c2: '#FE2C55',
      icon: '<svg ' + SQ + '><g transform="translate(-.9 -.7)" fill="#25F4EE"><path id="tk" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></g>' +
        '<g transform="translate(.9 .7)" fill="#FE2C55"><use href="#tk"/></g><use href="#tk" fill="#fff"/></svg>'
    },
    youtube: {
      color: '#FF3B3B', c1: '#FF0000', c2: '#FF8A3D',
      icon: '<svg ' + SQ + '><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
    }
  };

  /* Caras del cubo: la 0 es el logo de Kick, el resto se crean desde CONFIG.redes */
  var faces = [];
  (CONFIG.redes || []).forEach(function (r) {
    var def = REDES[r.red], u = (r.usuario || '').trim();
    if (!def || !u) return;
    var el = document.createElement('div');
    el.className = 'face' + (faces.length ? ' face--hidden' : '');
    el.dataset.seg = r.segundos || CONFIG.segundosRed;
    el.dataset.c1 = r.color1 || def.c1;
    el.dataset.c2 = r.color2 || def.c2;
    el.innerHTML = def.icon + userSvg(u, def.color);
    kick.appendChild(el);
    faces.push(el);
  });

  function applyColors(face) {
    if (!CONFIG.colorPorRed || !face) return;
    stage.style.setProperty('--c1', face.dataset.c1);
    stage.style.setProperty('--c2', face.dataset.c2);
  }
  applyColors(faces[0]);

  /* ---------- Forma del borde: recorre la pantalla y rodea el cubo abajo ---------- */
  function maskUrl(w, h, d, sw) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + d + '" fill="none" stroke="#000" stroke-width="' + sw + '" stroke-linejoin="miter"/></svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }

  var notchN = 45;   // medio ángulo (en grados) que ocupa la zona del cubo vista desde el centro

  function build() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;

    // Las dos caras del cubo miden igual (la más ancha manda)
    kick.style.removeProperty('--fw');
    var fw = 0; faces.forEach(function (f) { fw = Math.max(fw, f.offsetWidth); });
    kick.style.setProperty('--fw', fw + 'px');

    var sw = Math.max(2, Math.min(12, h * .009)), hf = sw / 2;
    var fh = h * .072, g = hf;
    var cx = w / 2, xl = cx - fw / 2 - g, xr = cx + fw / 2 + g, yn = h - fh - g;
    notchN = Math.atan((fw / 2 + g) / Math.max(1, yn - h / 2)) * 180 / Math.PI + 12;

    var d = 'M' + hf + ' ' + hf + ' H' + (w - hf) + ' V' + (h - hf) +
            ' H' + xr + ' V' + yn + ' H' + xl + ' V' + (h - hf) + ' H' + hf + ' Z';

    stage.style.setProperty('--m', maskUrl(w, h, d, sw));
    stage.style.setProperty('--mh', maskUrl(w, h, d, Math.max(1, sw * .35)));
  }

  build();
  window.addEventListener('resize', build);
  if (window.ResizeObserver) new ResizeObserver(build).observe(stage);

  if (faces.length < 2) return;

  /* ---------- Cubo 3D: cada giro en una dirección distinta ---------- */
  var VARIANTS = [
    { out: ['rotateX(0deg)', 'rotateX(-90deg)'], inn: ['rotateX(90deg)', 'rotateX(0deg)'] },
    { out: ['rotateX(0deg)', 'rotateX(90deg)'],  inn: ['rotateX(-90deg)', 'rotateX(0deg)'] },
    { out: ['rotateY(0deg)', 'rotateY(-90deg)'], inn: ['rotateY(90deg)', 'rotateY(0deg)'] },
    { out: ['rotateY(0deg)', 'rotateY(90deg)'],  inn: ['rotateY(-90deg)', 'rotateY(0deg)'] },
    { out: ['rotateX(0deg) rotateY(0deg)', 'rotateX(-90deg) rotateY(35deg)'], inn: ['rotateX(90deg) rotateY(-35deg)', 'rotateX(0deg) rotateY(0deg)'] },
    { out: ['rotateX(0deg) rotateY(0deg)', 'rotateX(90deg) rotateY(-35deg)'], inn: ['rotateX(-90deg) rotateY(35deg)', 'rotateX(0deg) rotateY(0deg)'] }
  ];
  var DURATION = 1000, EASE = 'cubic-bezier(.7, 0, .3, 1)';
  var cur = 0, lastV = -1;

  function pickVariant() {
    var n;
    do { n = Math.floor(Math.random() * VARIANTS.length); } while (n === lastV);
    lastV = n;
    return VARIANTS[n];
  }

  /* Sincronía: el giro espera a que las luces del borde estén lejos de la zona del cubo */
  var PERIOD = 4.6, LAG = 0.3, VIS_START = 180, VIS_END = 320;
  var spinAnim = null;

  function waitForClear() {
    if (CONFIG.estilo !== 'chroma' || CONFIG.sincronizar === false) return 0;
    if (!spinAnim) {
      var list = document.getAnimations ? document.getAnimations() : [];
      for (var i = 0; i < list.length; i++) {
        var an = list[i];
        if (an.animationName === 'spin' && an.effect && an.effect.target && an.effect.target.classList.contains('r1')) { spinAnim = an; break; }
      }
    }
    if (!spinAnim || spinAnim.currentTime == null) return 0;

    var lagDeg = LAG / PERIOD * 360;
    var span = (VIS_END + lagDeg) - VIS_START;            // arco que cubren las dos luces
    var move = 360 * (DURATION / 1000) / PERIOD;          // cuánto avanzan mientras el cubo gira
    var N = notchN;
    var width = 360 - 2 * N - span - move;                // ventana libre (en grados)
    if (width < 8) { N = Math.max(4, N - 10); width = 360 - 2 * N - span - move; }
    if (width < 4) return 0;

    var lo = N, hi = N + width;
    var a = ((Number(spinAnim.currentTime) % (PERIOD * 1000)) / (PERIOD * 1000)) * 360;
    if (a >= lo && a <= hi) return 0;
    var target = lo + width / 2;
    var diff = (target - a + 360) % 360;
    return diff / 360 * PERIOD * 1000;
  }

  function schedule() {
    var secs = Number(faces[cur].dataset.seg);
    setTimeout(function () {
      var extra = waitForClear();
      if (extra > 0) setTimeout(flip, extra); else flip();
    }, secs * 1000);
  }

  function flip() {
    var nxt = (cur + 1) % faces.length;
    var out = faces[cur];
    var inn = faces[nxt];
    var v = pickVariant();
    inn.classList.remove('face--hidden');
    applyColors(inn);
    var opts = { duration: DURATION, easing: EASE, fill: 'forwards' };
    var a1 = out.animate([
      { transform: v.out[0], filter: 'brightness(1)' },
      { transform: v.out[1], filter: 'brightness(.45)' }
    ], opts);
    var a2 = inn.animate([
      { transform: v.inn[0], filter: 'brightness(.45)' },
      { transform: v.inn[1], filter: 'brightness(1)' }
    ], opts);
    a2.onfinish = function () {
      out.classList.add('face--hidden');
      a1.cancel();
      a2.cancel();
      cur = nxt;
      schedule();
    };
  }

  schedule();
})();
</script>
</body>
</html>
