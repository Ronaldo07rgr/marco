/* ---------- Borde animado ---------- */
.frame { position: absolute; inset: 0; pointer-events: none; }
.ring {
  position: absolute; inset: 0;
  -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat;
  mask: var(--m) 0 0 / 100% 100% no-repeat;
}

.frame[data-style="chroma"] .r1 {
  background: conic-gradient(from var(--a), transparent 0 52%, var(--c1) 88%, transparent 100%);
  animation: spin 4.6s linear infinite;
  mix-blend-mode: screen;
}
.frame[data-style="chroma"] .r2 {
  background: conic-gradient(from var(--a), transparent 0 52%, var(--c2) 88%, transparent 100%);
  animation: spin 4.6s linear infinite;
  animation-delay: -.3s;
  mix-blend-mode: screen;
}

.frame[data-style="neon"] { filter: drop-shadow(0 0 .8cqh var(--c1)) drop-shadow(0 0 2.2cqh var(--c2)); }
.frame[data-style="neon"] .r1 {
  background: linear-gradient(135deg, var(--c1), var(--c2));
  animation: breathe 2.6s ease-in-out infinite;
}
.frame[data-style="neon"] .r2,
.frame[data-style="rainbow"] .r2 { display: none; }

.frame[data-style="rainbow"] { filter: drop-shadow(0 0 1.4cqh rgba(255,255,255,.35)); }
.frame[data-style="rainbow"] .r1 {
  background: conic-gradient(from var(--a), #ff3d81, #ffb347, #c6ff3d, #2ee6a6, #25f4ee, #7b6cff, #ff3d81);
  animation: spin 6s linear infinite;
}

@keyframes spin { to { --a: 360deg; } }
@keyframes breathe { 0%,100% { opacity: .78; } 50% { opacity: 1; } }

/* ---------- Logo abajo al centro, con destellos ---------- */
.logo {
  position: absolute; left: 50%; bottom: 0;
  translate: -50% 0;
  height: var(--lh);
  aspect-ratio: 2172 / 724;
  z-index: 2;
  pointer-events: none;
}
.logo > * { position: absolute; }

/* El logo, que respira con luz verde */
.img {
  inset: 0;
  background: var(--logo) center / 100% 100% no-repeat;
  z-index: 1;
}

/* Brillo que cruza el logo cada pocos segundos */
.shine {
  inset: 0;
  -webkit-mask: var(--logo) center / 100% 100% no-repeat;
  mask: var(--logo) center / 100% 100% no-repeat;
  background: linear-gradient(105deg, transparent 0 42%, rgba(255,255,255,.95) 50%, transparent 58% 100%);
  background-size: 320% 100%;
  background-position: 135% 0;
  z-index: 2;
  animation: shine 5s ease-in-out infinite;
}
@keyframes shine {
  0%       { background-position: 135% 0; }
  34%,100% { background-position: -35% 0; }
}

/* Destellos en forma de estrella */
.sparks {
  inset: 0; z-index: 3;
}
.spark {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--s); aspect-ratio: 1;
  translate: -50% -50%;
  background: #fff;
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
  scale: 0; opacity: 0;
  animation: twinkle var(--t) ease-in-out infinite;
  animation-delay: var(--d);
}
@keyframes twinkle {
  0%,100% { scale: 0;   rotate: 0deg;  opacity: 0; }
  42%     { scale: 1;   rotate: 45deg; opacity: 1; }
  70%     { scale: .35; rotate: 80deg; opacity: .7; }
}

/* ---------- Redes sociales: franja de abajo, a los lados del logo ---------- */
.stage { --lw: calc(var(--lh) * 3); }          /* ancho del logo (proporción 3:1) */
.socials { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.slot {
  position: absolute; bottom: 0;
  height: calc(var(--lh) / 2 - .5cqh);          /* franja libre bajo la línea del marco */
  display: grid; align-items: center;
}
.slot.izq { right: calc(50% + var(--lw) / 2 + 2cqh); justify-items: end; }
.slot.der { left:  calc(50% + var(--lw) / 2 + 2cqh); justify-items: start; }

.net {
  grid-area: 1 / 1;
  display: flex; align-items: center; gap: .75em;
  padding: .16em .9em .16em .75em;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: calc(var(--lh) * .28);
  font-weight: 800; font-style: italic; line-height: 1.1;
  white-space: nowrap; color: #fff;
  background: linear-gradient(135deg, rgba(4,10,30,.78), rgba(8,26,64,.78));
  border: 1px solid var(--c2);
  border-radius: .5em;
  box-shadow: 0 0 1.2cqh var(--c1), inset 0 0 .8cqh rgba(56,189,255,.25);
  text-shadow: 0 0 .5em var(--c1);
  opacity: 0; transform: translateY(35%) scale(.92); filter: blur(.2em);
  transition: opacity .8s ease, transform .8s ease, filter .8s ease;
}
.net.on {
  opacity: 1; transform: none; filter: none;
  transition-delay: .85s;                       /* espera a que la anterior se haya ido */
}
.net .red {
  font-size: .62em; letter-spacing: .14em; text-transform: uppercase;
  color: var(--c2); text-shadow: none;
}
.net .ico { display: flex; color: var(--c2); filter: drop-shadow(0 0 .35em var(--c1)); }
.net .ico svg { height: 1.1em; width: auto; display: block; }
.net .sep { width: .12em; height: 1.1em; background: var(--c1); border-radius: 1em; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
  </div>

  <div class="logo" role="img" aria-label="TheBicho">
    <div class="img"></div>
    <div class="shine"></div>
    <div class="sparks">
      <i class="spark" style="--x:17%;--y:30%; --s:5cqh;  --t:2.8s;--d:0s"></i>
      <i class="spark" style="--x:41%;--y:9%;  --s:6.5cqh;--t:2.8s;--d:.7s"></i>
      <i class="spark" style="--x:82%;--y:12%; --s:5cqh;  --t:2.8s;--d:1.4s"></i>
      <i class="spark" style="--x:5%;  --y:40%; --s:3.4cqh;--t:3.3s;--d:.4s"></i>
      <i class="spark" style="--x:95%; --y:36%; --s:3.8cqh;--t:3.1s;--d:1.9s"></i>
      <i class="spark" style="--x:22%; --y:88%; --s:3cqh;  --t:3.6s;--d:1.1s"></i>
      <i class="spark" style="--x:72%; --y:86%; --s:3.4cqh;--t:3.2s;--d:2.4s"></i>
      <i class="spark" style="--x:55%; --y:46%; --s:2.8cqh;--t:3.4s;--d:2.9s"></i>
    </div>
  </div>

  <div class="socials">
    <div class="slot izq" id="slotIzq"></div>
    <div class="slot der" id="slotDer"></div>
  </div>
</div>

<script>
/* ============ AJUSTES: cambia lo que quieras aquí ============ */
var CONFIG = {
  estilo: 'chroma',           // 'chroma' | 'neon' | 'rainbow'
  color1: '#1E6BFF',          // azul eléctrico del logo
  color2: '#38BDFF',          // azul celeste del logo
  altoLogo: 13.5,               // alto del logo, en % del alto de la pantalla
  margenLogo: 1.5,            // separación entre el logo y el marco, en % del alto de la pantalla

  // Redes: salen de una en una en cada lado, con efecto de aparecer y desaparecer
  redesIzquierda: [
    { red: 'YouTube', usuario: '@TheBicho07' },
    { red: 'Kick',    usuario: 'TheBicho07' }
  ],
  redesDerecha: [
    { red: 'Instagram', usuario: '_thebicho_' },
    { red: 'TikTok',    usuario: '_thebicho' }
  ],
  segundosPorRed: 6,          // cuánto se queda cada red en pantalla
  desfaseDerecha: 0           // segundos de diferencia entre un lado y el otro (0 = cambian a la vez)
};
/* ============================================================= */

(function () {
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');

  frame.setAttribute('data-style', CONFIG.estilo);
  stage.style.setProperty('--c1', CONFIG.color1);
  stage.style.setProperty('--c2', CONFIG.color2);
  stage.style.setProperty('--lh', (CONFIG.altoLogo || 15) + 'cqh');

  function maskUrl(w, h, d, sw) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + d + '" fill="none" stroke="#000" stroke-width="' + sw + '" stroke-linejoin="miter"/></svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }

  /* Borde recto: la línea inferior pasa por el centro del logo y se abre a su
     alrededor, así el marco no cruza ni por detrás ni por encima del logo */
  function build() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    var sw = Math.max(2, Math.min(12, h * .009)), hf = sw / 2;

    var logoH = h * (CONFIG.altoLogo || 15) / 100;
    var logoW = logoH * 2172 / 724;                       // proporción del logo
    var gap   = logoW / 2 + h * (CONFIG.margenLogo || 0) / 100;
    var cx    = w / 2;
    var by    = h - logoH / 2;                           // altura del borde inferior = centro del logo

    var d = 'M' + (cx + gap) + ' ' + by +                // arranca a la derecha del logo
            ' H' + (w - hf) + ' V' + hf +                // esquina inf. der. -> sup. der.
            ' H' + hf + ' V' + by +                      // sup. izq. -> inf. izq.
            ' H' + (cx - gap);                           // termina a la izquierda del logo
    stage.style.setProperty('--m', maskUrl(w, h, d, sw));
  }

  /* ---------- Redes: aparecen y desaparecen una por una ---------- */
  var ICONOS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M4 4.5h16a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3zM9.8 8.6v6.8l5.9-3.4z"/></svg>',
    kick: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg>'
  };

  function montarLado(slotId, lista, retrasoSeg) {
    var slot = document.getElementById(slotId);
    if (!slot || !lista || !lista.length) return;
    var els = lista.map(function (n) {
      var el = document.createElement('div');
      el.className = 'net';
      var red = document.createElement('span');
      var clave = String(n.red || '').toLowerCase().replace(/\s/g, '');
      if (ICONOS[clave]) { red.className = 'ico'; red.innerHTML = ICONOS[clave]; }   // logo de la red
      else { red.className = 'red'; red.textContent = n.red; }                      // si no hay logo, el nombre
      var sep = document.createElement('span');  sep.className = 'sep';
      var usr = document.createElement('span');  usr.className = 'user'; usr.textContent = n.usuario;
      el.appendChild(red); el.appendChild(sep); el.appendChild(usr);
      slot.appendChild(el);
      return el;
    });
    var i = 0, paso = (CONFIG.segundosPorRed || 4) * 1000;
    function tick() {
      els.forEach(function (el, j) { el.classList.toggle('on', j === i % els.length); });
      i++;
    }
    setTimeout(function () { tick(); setInterval(tick, paso); }, (retrasoSeg || 0) * 1000);
  }
  montarLado('slotIzq', CONFIG.redesIzquierda, 0);
  montarLado('slotDer', CONFIG.redesDerecha, CONFIG.desfaseDerecha || 0);

  build();
  window.addEventListener('resize', build);
  if (window.ResizeObserver) new ResizeObserver(build).observe(stage);
})();
</script>
